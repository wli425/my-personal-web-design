name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      pages-ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        # Still verify the build before the owner enables Pages for the first time.
        # A failed metadata read MUST NOT result in a production deployment.
        continue-on-error: true
      - name: Build and check website
        env:
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          base="/${GITHUB_REPOSITORY#*/}/"
          if [ "$PAGES_OUTCOME" = "success" ]; then
            base="${PAGES_BASE_PATH%/}/"
          else
            echo "::warning::Pages configuration is unavailable. Enable Settings > Pages > Source: GitHub Actions, then run this workflow again."
          fi
          npm run build -- --base="$base"
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          node scripts/verify-pages-build.mjs "$base"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require Pages configuration
        env:
          PAGES_READY: ${{ needs.build.outputs.pages-ready }}
        run: |
          if [ "$PAGES_READY" != "true" ]; then
            echo "::error::Pages is not configured or its metadata could not be read. Open Settings > Pages, select GitHub Actions, and rerun the workflow. Private repositories require a GitHub plan that supports Pages."
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
